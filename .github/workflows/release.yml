name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: tpm-dashboard-mcp-linux-x86_64
            sep: ":"
          - os: windows-latest
            name: tpm-dashboard-mcp-windows-x86_64.exe
            sep: ";"
          - os: macos-latest
            name: tpm-dashboard-mcp-macos-arm64
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build single executable
        run: pyinstaller --onefile --noconfirm --name "${{ matrix.name }}" --add-data "frontend/dist${{ matrix.sep }}frontend" main.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
