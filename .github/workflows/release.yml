name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: tpm-dashboard-mcp-linux-x86_64
            sep: ":"
          - os: windows-latest
            name: tpm-dashboard-mcp-windows-x86_64.exe
            sep: ";"
          - os: macos-latest
            name: tpm-dashboard-mcp-macos-arm64
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build single executable
        run: pyinstaller --onefile --noconfirm --name "${{ matrix.name }}" --add-data "frontend/dist${{ matrix.sep }}frontend" --collect-all playwright main.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            **Install (no build required):** download the binary for your OS →
            Linux: `sudo install -m 755 <file> /usr/local/bin/tpm-dashboard-mcp` ·
            macOS: `xattr -d com.apple.quarantine <file> || true` then the same `install` ·
            Windows: keep the `.exe` anywhere (e.g. `C:\Tools`).
            **Run:** `tpm-dashboard-mcp app` (Ctrl+C stops) → connect your AI client with
            `command: ["/usr/local/bin/tpm-dashboard-mcp", "start"]`.
            **PDF tools (optional):** `npx playwright install chromium`. Full details in the README.
            *Prototype — not a production application.*
          files: release/*
